<VirtualHost *:80>
    ServerName open-webui
    ServerAlias *

    ProxyRequests Off
    ProxyPreserveHost On

    RequestHeader setIfEmpty X-Forwarded-Proto "http"

    RedirectMatch 301 ^/open-webui$ /open-webui/

    ProxyPass /open-webui/ws/ http://127.0.0.1:3000/ws/ upgrade=websocket
    ProxyPassReverse /open-webui/ws/ http://127.0.0.1:3000/ws/
    ProxyPass /open-webui/ http://127.0.0.1:3000/
    ProxyPassReverse /open-webui/ http://127.0.0.1:3000/

    ErrorLog logs/open-webui-error.log
    CustomLog logs/open-webui-access.log combined
</VirtualHost>
